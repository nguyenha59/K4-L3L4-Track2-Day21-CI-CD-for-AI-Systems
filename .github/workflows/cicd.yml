name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # STORAGE_CREDENTIALS la JSON dang:
        #   {"aws_access_key_id": "...", "aws_secret_access_key": "...", "region": "ap-southeast-1"}
        # ("region" khong bat buoc, mac dinh us-east-1).
        # Tach JSON thanh cac bien moi truong AWS_* ma ca DVC lan boto3 deu tu doc.
        # Dung ::add-mask:: de gia tri khong bi in ra log.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          values = {
              "AWS_ACCESS_KEY_ID": creds["aws_access_key_id"],
              "AWS_SECRET_ACCESS_KEY": creds["aws_secret_access_key"],
              "AWS_DEFAULT_REGION": creds.get("region", "us-east-1"),
          }
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for key, value in values.items():
                  print(f"::add-mask::{value}")
                  env_file.write(f"{key}={value}\n")
          PYEOF

      - name: Pull data with DVC
        # Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
          print(f"Uploaded models/model.joblib -> s3://{bucket_name}/artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          THRESHOLD = 0.65
          raw = os.environ.get("F1", "").strip()
          if not raw:
              raise SystemExit("FAILED: khong doc duoc f1_score tu job Train.")

          # GitHub Actions outputs la chuoi, phai doi sang float truoc khi so sanh
          f1 = float(raw)
          if f1 < THRESHOLD:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < {THRESHOLD}. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= {THRESHOLD}. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart income-api

            # Server can thoi gian tai model tu cloud storage, nen thu lai nhieu lan
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed (lan thu $i)."
                exit 0
              fi
              echo "Server chua san sang, thu lai sau 5s ($i/12)..."
              sleep 5
            done

            echo "Health check FAILED sau 60s."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
